---
input_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'CSV with sample_name,fraction_id,annotation_id,path columns'
decoy_database:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Target-decoy FASTA database'
decoy_string:
  type: 'String'
  required: true
  help: 'Decoy accession marker shared by MSFragger, validation, and ProtLoom'
decoy_position:
  type: 'String'
  required: true
  help: 'Decoy marker position; prefix is required by search-ProteomicDIA'
contam_string:
  type: 'String'
  required: true
  help: 'Contaminant accession marker in the ProtLoom project YAML'
contam_position:
  type: 'String'
  required: true
  help: 'Contaminant marker position: prefix or suffix'
reconstruct_nextflow_version:
  type: 'String'
  required: true
  help: 'Nextflow version for reconstruct-ProteomicMSMS; default 25.10.5'
diatracer_executable:
  type: 'String'
  required: false
  allow_empty: true
  help: 'diaTracer JAR required for Bruker .d input'
bruker_lib_dir:
  type: 'String'
  required: false
  allow_empty: true
  help: 'MSFragger ext/bruker directory required for Bruker .d input'
msfragger_executable:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'MSFragger JAR'
output_dir:
  type: 'Path'
  mode: 'w'
  required: true
  help: 'Directory for metapipeline results'
dataset_id:
  type: 'String'
  required: true
  help: 'Cohort identifier'
child_profile:
  type: 'String'
  required: true
  help: 'Nextflow profile for each component pipeline'
proteovault_version:
  type: 'String'
  required: false
  help: 'ProteoVault version used for the container image'
docker_image_proteovault:
  type: 'String'
  required: false
  help: 'ProteoVault container image built from proteovault_version by default'
compute_profile:
  type: 'String'
  required: false
  allow_empty: true
  help: 'Resource profile name; built-in names are pines and boutroslab_aws'
additional_resource_profile_dir:
  type: 'String'
  required: false
  allow_empty: true
  help: 'Optional PATH-style list of directories searched before bundled resource profiles'
reconstruct_ProteomicMSMS:
  type: 'Namespace'
  required: true
  help: 'diaTracer reconstruction pipeline parameters'
search_ProteomicDIA:
  type: 'Namespace'
  required: true
  help: 'Search pipeline parameters'
validate_ProteomicPSM:
  type: 'Namespace'
  required: true
  help: 'PSM validation pipeline parameters'
generate_ProteomicSpectralLibrary:
  type: 'Namespace'
  required: true
  help: 'Spectral library pipeline parameters'
quantitate_ProteomicDIA:
  type: 'Namespace'
  required: true
  help: 'DIA quantitation pipeline parameters'
qc_ProteomicDIA:
  type: 'Namespace'
  required: true
  help: 'DIA quality-control pipeline parameters'
