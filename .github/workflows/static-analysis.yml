---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: TheBoutrosLab/tool-static-analysis@v1
        env:
          # SpectroMesa intentionally omits the standard repository prefix.
          IGNORE_NAMED_TESTS: repo-name
