<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="780" viewBox="0 0 1850 780" role="img" aria-labelledby="figure-title figure-description">
  <title id="figure-title">Proteomic DIA pipeline workflow</title>
  <desc id="figure-description">MS data files are converted to mzML before search, while Bruker .d acquisitions bypass conversion and are reconstructed by diaTracer. Converted mzML or original Bruker .d and the library feed DIA-NN. Quality control summarizes the results, and ProteoVault builds a database for supported protein inference routes. A target-decoy FASTA feeds search and validation.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #183044; }
      .name { font-size: 20px; font-weight: 700; }
      .tool { font-size: 16px; fill: #3e5868; }
      .small { font-size: 14px; fill: #536b79; }
      .handoff { font-size: 13px; font-weight: 700; fill: #334d5b; }
      .card { fill: #fff; stroke: #c4d4dc; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #52758a; stroke-width: 3; marker-end: url(#arrowhead); }
      .input { fill: none; stroke: #159a89; stroke-width: 2.5; marker-end: url(#tealhead); }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#52758a"/></marker>
    <marker id="tealhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#159a89"/></marker>
  </defs>
  <rect width="1850" height="780" fill="#f7fafb"/>

  <rect x="50" y="34" width="1750" height="96" rx="16" class="card"/>
  <rect x="50" y="34" width="9" height="96" rx="4" fill="#159a89"/>
  <text x="78" y="73" class="name">Sample acquisitions</text>
  <text x="78" y="102" class="tool">MS data file or Bruker .d · sample_name, fraction_id, annotation_id, path</text>

  <path d="M200 130 V250" class="input"/>
  <text x="211" y="191" class="handoff">Bruker .d</text>
  <path d="M550 130 V145" class="input"/>
  <path d="M550 235 V250" class="arrow"/>
  <path d="M1600 130 V250" class="input"/>
  <text x="1612" y="191" class="handoff">Bruker .d for DIA-NN</text>

  <rect x="400" y="145" width="300" height="90" rx="14" class="card"/>
  <rect x="400" y="145" width="300" height="7" rx="4" fill="#3174a4"/>
  <text x="422" y="181" class="name">Convert MS data</text>
  <text x="422" y="208" class="tool">convert-MSData · file → mzML</text>

  <rect x="50" y="260" width="300" height="170" rx="16" class="card"/>
  <rect x="50" y="260" width="300" height="9" rx="4" fill="#3b8494"/>
  <text x="72" y="307" class="name">Reconstruct MS/MS</text>
  <text x="72" y="338" class="tool">reconstruct-ProteomicMSMS</text>
  <text x="72" y="373" class="small">diaTracer · Bruker .d only</text>
  <text x="72" y="400" class="small">.d → pseudo-MS/MS mzML</text>

  <rect x="400" y="260" width="300" height="170" rx="16" class="card"/>
  <rect x="400" y="260" width="300" height="9" rx="4" fill="#3174a4"/>
  <text x="422" y="307" class="name">Search</text>
  <text x="422" y="338" class="tool">search-ProteomicDIA</text>
  <text x="422" y="373" class="small">MSFragger</text>
  <text x="422" y="400" class="small">mzML → idXML</text>

  <rect x="750" y="260" width="300" height="170" rx="16" class="card"/>
  <rect x="750" y="260" width="300" height="9" rx="4" fill="#775ca6"/>
  <text x="772" y="307" class="name">Validate PSMs</text>
  <text x="772" y="338" class="tool">validate-ProteomicPSM</text>
  <text x="772" y="373" class="small">MSBooster → Percolator</text>
  <text x="772" y="400" class="small">→ protein inference</text>

  <rect x="1100" y="260" width="300" height="170" rx="16" class="card"/>
  <rect x="1100" y="260" width="300" height="9" rx="4" fill="#b87832"/>
  <text x="1122" y="307" class="name">Generate library</text>
  <text x="1122" y="338" class="tool">generate-Proteomic-</text>
  <text x="1122" y="360" class="tool">SpectralLibrary</text>
  <text x="1122" y="400" class="small">EasyPQP → library TSV</text>

  <rect x="1450" y="260" width="300" height="170" rx="16" class="card"/>
  <rect x="1450" y="260" width="300" height="9" rx="4" fill="#26907f"/>
  <text x="1472" y="307" class="name">Quantitate DIA</text>
  <text x="1472" y="338" class="tool">quantitate-ProteomicDIA</text>
  <text x="1472" y="373" class="small">DIA-NN</text>
  <text x="1472" y="400" class="small">converted mzML / .d + library</text>

  <path d="M350 345 H390" class="arrow"/>
  <text x="354" y="330" class="handoff">mzML</text>
  <path d="M700 345 H740" class="arrow"/>
  <text x="707" y="330" class="handoff">idXML</text>
  <path d="M1050 345 H1090" class="arrow"/>
  <text x="1055" y="313" class="handoff">idXML +</text>
  <text x="1055" y="329" class="handoff">TSVs</text>
  <path d="M1400 345 H1440" class="arrow"/>
  <text x="1404" y="330" class="handoff">library</text>

  <rect x="50" y="505" width="650" height="97" rx="16" class="card"/>
  <rect x="50" y="505" width="9" height="97" rx="4" fill="#159a89"/>
  <text x="78" y="544" class="name">Target-decoy database</text>
  <text x="78" y="573" class="tool">FASTA for search and PSM validation</text>
  <path d="M500 505 V440" class="input"/>
  <path d="M600 505 V462 H900 V440" class="input"/>

  <rect x="750" y="505" width="1050" height="97" rx="16" class="card"/>
  <rect x="750" y="505" width="9" height="97" rx="4" fill="#536aa5"/>
  <text x="778" y="544" class="name">Cohort QC</text>
  <text x="778" y="573" class="tool">qc-ProteomicDIA · converted/reconstructed mzML, search, validation, library, DIA-NN</text>
  <path d="M1600 430 V495" class="arrow"/>

  <rect x="750" y="642" width="1050" height="106" rx="16" class="card"/>
  <rect x="750" y="642" width="9" height="106" rx="4" fill="#765996"/>
  <text x="778" y="681" class="name">ProteoVault</text>
  <text x="778" y="710" class="tool">Core quantitation + FASTA + QC → DuckDB</text>
  <text x="778" y="734" class="small">Optional database assembly</text>
  <path d="M1275 602 V632" class="arrow"/>
  <path d="M500 602 V695 H740" class="input"/>
  <text x="570" y="681" class="handoff" style="fill:#158675">FASTA</text>
</svg>
